server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes renvoient index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache des assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
