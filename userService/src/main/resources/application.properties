spring.application.name=userService
server.port=8100

# Config Server (optionnel)
spring.config.import=optional:configserver:http://localhost:8883

# Eureka
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}:${server.port}

# Base de données PostgreSQL (user_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Sécurité — Keycloak (realm web4all)
keycloak.realm-url=http://localhost:8081/realms/web4all
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.realm-url}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.realm-url}/protocol/openid-connect/certs

# Actuator
management.endpoints.web.exposure.include=health,info
