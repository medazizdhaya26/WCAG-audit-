<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16261C"/>
      <stop offset="1" stop-color="#0F1C14"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="760" height="1080" fill="url(#bg)"/>

  <!-- Halos décoratifs -->
  <circle cx="650" cy="150" r="220" fill="#D9F95F" opacity="0.10"/>
  <circle cx="90" cy="980" r="200" fill="#F7C6D8" opacity="0.12"/>
  <circle cx="700" cy="900" r="120" fill="#D9F95F" opacity="0.08"/>

  <!-- Logo -->
  <g transform="translate(64,88)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#D9F95F"/>
    <path d="M8 17 L15 24 L27 9" stroke="#15241B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="25" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3">WEB4ALL</text>
  </g>

  <!-- Fenêtre navigateur + audit -->
  <g transform="translate(190,250)">
    <rect x="0" y="0" width="380" height="270" rx="20" fill="#1E3327"/>
    <rect x="0" y="0" width="380" height="46" rx="20" fill="#25402F"/>
    <circle cx="26" cy="23" r="6" fill="#F7C6D8"/>
    <circle cx="48" cy="23" r="6" fill="#D9F95F"/>
    <circle cx="70" cy="23" r="6" fill="#8FA89A"/>
    <!-- lignes de contenu -->
    <rect x="28" y="78" width="180" height="16" rx="8" fill="#3A5344"/>
    <rect x="28" y="110" width="300" height="12" rx="6" fill="#33493C"/>
    <rect x="28" y="132" width="260" height="12" rx="6" fill="#33493C"/>
    <rect x="28" y="154" width="290" height="12" rx="6" fill="#33493C"/>
    <!-- badge score -->
    <circle cx="315" cy="205" r="42" fill="#15241B" stroke="#D9F95F" stroke-width="4"/>
    <text x="315" y="214" fill="#D9F95F" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">92</text>
    <!-- marqueurs -->
    <rect x="28" y="196" width="70" height="26" rx="8" fill="#DC2626" opacity="0.85"/>
    <rect x="108" y="196" width="70" height="26" rx="8" fill="#D9F95F" opacity="0.9"/>
  </g>

  <!-- Icône accessibilité -->
  <g transform="translate(96,300)" opacity="0.95">
    <circle cx="0" cy="0" r="20" fill="#F7C6D8"/>
    <path d="M-34 30 H34" stroke="#F7C6D8" stroke-width="11" stroke-linecap="round"/>
    <path d="M0 20 V70" stroke="#F7C6D8" stroke-width="11" stroke-linecap="round"/>
    <path d="M0 70 L-28 118" stroke="#F7C6D8" stroke-width="11" stroke-linecap="round"/>
    <path d="M0 70 L28 118" stroke="#F7C6D8" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- Slogan -->
  <text x="64" y="720" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Un web</text>
  <text x="64" y="778" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">accessible</text>
  <text x="64" y="836" fill="#D9F95F" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">pour tous.</text>

  <text x="66" y="892" fill="#B9C6BE" font-family="Segoe UI, Arial, sans-serif" font-size="18">Audit WCAG automatise, rapports et corrections IA.</text>

  <!-- Puces -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E6EFE9">
    <circle cx="72" cy="946" r="5" fill="#D9F95F"/><text x="88" y="951">Analyse complete du site</text>
    <circle cx="72" cy="982" r="5" fill="#D9F95F"/><text x="88" y="987">Score de conformite par page</text>
    <circle cx="72" cy="1018" r="5" fill="#D9F95F"/><text x="88" y="1023">Corrections generees par IA</text>
  </g>
</svg>
